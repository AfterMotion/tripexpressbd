<svg xmlns="http://www.w3.org/2000/svg">
<!--
  Trip Express BD icon sprite.

  Line icons: Lucide geometry on a 24x24 grid, round caps and joins.

  Stroke width is NOT set here. stroke-width is an inherited SVG property, so it is
  declared once in site.css, per icon size, and inherits through the <use> shadow
  tree. That is the only way to keep the RENDERED stroke optically equal across
  sizes: one 2px stroke on a 24 grid drawn into a 16px box is a third heavier than
  the same stroke drawn into a 24px box, which is what made the old set look uneven.
  Rendered stroke target: about 1.5px at every size.

  Presentation attributes live on each symbol element, never in a style block. A
  style block inside defs is NOT cloned into the use shadow tree of an EXTERNAL
  sprite, so styling symbols by class there renders nothing at all.

  Note for editors: an XML comment may not contain two consecutive hyphens, so CSS
  class names are written here without their leading dashes.

  Brand glyphs (whatsapp, facebook) are solid fills and are the only exception -
  those marks are owned by other companies and must not be redrawn as line icons.

  Reference: .claude/skills/trip-express-brand/references/06-components.md
-->

